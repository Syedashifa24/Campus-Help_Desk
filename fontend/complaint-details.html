<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details | Campus Help Desk</title>
    <link rel="stylesheet" href="css/complaint-details.css">
</head>
<body>

    <header class="header">
        <div class="logo">Campus <span>Help Desk</span></div>
        <a href="my-complaints.html" class="back-link">← My Complaints</a>
    </header>

    <main class="container">

        <div class="page-heading">
            <span class="tag">STUDENT PORTAL</span>
            <h1>Complaint Details</h1>
            <p>View the complete information about your complaint.</p>
        </div>

        <section class="details-card">

            <div class="details-top">
                <h2 id="complaintTitle">Loading...</h2>
                <span id="complaintStatus" class="status">Loading...</span>
            </div>

            <p class="complaint-id" id="complaintId"></p>

            <div class="details-grid">
                <div class="detail-item">
                    <label>Category</label>
                    <p id="category"></p>
                </div>

                <div class="detail-item">
                    <label>Priority</label>
                    <p id="priority"></p>
                </div>

                <div class="detail-item">
                    <label>Location</label>
                    <p id="location"></p>
                </div>

                <div class="detail-item">
                    <label>Submitted Date</label>
                    <p id="createdAt"></p>
                </div>
            </div>

            <div class="description-section">
                <label>Description</label>
                <p id="description"></p>
            </div>

            <p id="errorMessage" class="error-message"></p>

        </section>

        <a href="my-complaints.html" class="back-btn">Back to My Complaints</a>

    </main>

    <script src="js/complaint-details.js"></script>

</body>
</html>
